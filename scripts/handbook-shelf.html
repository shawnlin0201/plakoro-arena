<!doctype html>
<meta charset="utf-8">
<title>秘笈手冊 — 書架（權限示範）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  A local stand-in for the real thing, produced by scripts/split-handbook-pdf.py.

  It exists to show one decision working: a player holds some chapters and not others, and the
  shelf is built from what they hold. Here the entitlement list is a checkbox you can toggle;
  in production it is `player_unlocks` and the toggle is the admin screen. Nothing else about
  the shape changes — which is the point of demonstrating it this way.

  The one thing this page CANNOT demonstrate is the part that actually protects the book: here
  every PDF sits in a folder a browser can reach. In production the files live in the private
  API repo and `GET /api/handbook/:unit` returns 404 unless the unlock row exists, so an
  unowned chapter is not locked on screen — it is never sent.
-->
<style>
  :root {
    --ink: #1F1F1D; --sub: #6B6A63; --line: #DFDDD4; --bg: #FAF9F4; --card: #fff;
    --lock: #B4531F; --own: #3C6E47;
  }
  * { box-sizing: border-box; }
  /* `.empty` sets display:grid, which outranks the UA stylesheet's [hidden] rule — without
     this the placeholder stayed on screen above the opened chapter. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 "Hiragino Sans", "Noto Sans TC", system-ui, sans-serif;
    display: grid; grid-template-columns: 20rem 1fr; height: 100vh;
  }
  nav { border-right: 1px solid var(--line); background: var(--card); overflow-y: auto; padding: 1rem 0.75rem 3rem; }
  .brand { font-weight: 800; padding: 0 0.5rem; }
  .brand small { display: block; font-weight: 600; color: var(--lock); font-size: 0.72rem; }
  .sim {
    margin: 0.75rem 0; padding: 0.6rem 0.7rem; border: 1px dashed var(--line);
    border-radius: 0.4rem; font-size: 0.78rem; color: var(--sub);
  }
  .sim b { color: var(--ink); }
  .sim label { display: flex; gap: 0.4rem; align-items: center; margin-top: 0.4rem; color: var(--ink); }
  .grp { font-size: 0.7rem; font-weight: 800; letter-spacing: .08em; color: var(--sub); padding: 0.9rem 0.5rem 0.3rem; }
  .row {
    display: flex; align-items: center; gap: 0.5rem; width: 100%; text-align: left;
    padding: 0.35rem 0.5rem; border: 0; background: none; border-radius: 0.3rem;
    font: inherit; font-size: 0.85rem; color: var(--ink); cursor: pointer;
  }
  .row:hover { background: var(--bg); }
  .row.on { background: var(--ink); color: #fff; }
  .row.locked { color: var(--sub); cursor: not-allowed; }
  .row .mark { font-size: 0.8rem; width: 1rem; flex: none; }
  .row .n { margin-left: auto; font-size: 0.72rem; color: var(--sub); font-variant-numeric: tabular-nums; }
  .row.on .n { color: rgba(255,255,255,.65); }
  main { display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 0.7rem 1rem; border-bottom: 1px solid var(--line); background: var(--card);
    display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; margin: 0; }
  header .meta { font-size: 0.78rem; color: var(--sub); }
  iframe { flex: 1; width: 100%; border: 0; background: #52514c; }
  .empty { flex: 1; display: grid; place-items: center; text-align: center; padding: 2rem; }
  .empty p { max-width: 24rem; color: var(--sub); font-size: 0.9rem; }
  .empty .lock { font-size: 2rem; }
  code { background: var(--card); border: 1px solid var(--line); border-radius: 0.25rem; padding: 0.05rem 0.3rem; font-size: 0.82rem; }
  @media (max-width: 52rem) { body { grid-template-columns: 1fr; height: auto; } iframe { height: 70vh; } }
</style>
<nav>
  <div class="brand">秘笈手冊 書架<small>本機示範 · 請勿散佈</small></div>
  <div class="sim">
    模擬玩家 <b id="who">P000003</b> 的持有狀態。<br>
    正式環境這份清單來自 <code>player_unlocks</code>。
    <label><input type="checkbox" id="all"> 全部解鎖（模擬買了全套）</label>
  </div>
  <div id="list"></div>
</nav>
<main>
  <header><h1 id="title">選擇一個章節</h1><span class="meta" id="meta"></span></header>
  <div class="empty" id="empty"><div><div class="lock">📖</div><p>左側選一個已解鎖的章節。</p></div></div>
  <iframe id="view" hidden title="章節內容"></iframe>
</main>
<script>
// Who owns what. The only thing that decides whether a chapter opens — swap this for the
// response of GET /api/players/me (its `unlocks` array) and the rest of the page is unchanged.
const OWNED = new Set(['base', 'chara.STW04', 'chara.EBC02-001', 'chara.EBC02-006'])
let all = false
const owns = id => all || OWNED.has(id)

let manifest = null, current = null

function render() {
  const groups = new Map()
  for (const u of manifest.units) {
    const g = u.group || '　'
    if (!groups.has(g)) groups.set(g, [])
    groups.get(g).push(u)
  }
  document.getElementById('list').innerHTML = [...groups].map(([g, us]) =>
    (g.trim() ? `<div class="grp">${g}</div>` : '')
    + us.map(u => {
      const ok = owns(u.id)
      return `<button class="row ${ok ? '' : 'locked'}" data-id="${u.id}" ${ok ? '' : 'disabled'}>`
        + `<span class="mark">${ok ? '📘' : '🔒'}</span><span>${u.title}</span>`
        + `<span class="n">${u.pages} 頁</span></button>`
    }).join('')).join('')
  for (const b of document.querySelectorAll('.row[data-id]')) {
    b.addEventListener('click', () => open(b.dataset.id))
  }
  if (current && !owns(current)) close()
  if (current) markActive(current)
}

function markActive(id) {
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('on', r.dataset.id === id))
}

function open(id) {
  const u = manifest.units.find(x => x.id === id)
  // Checked again here, not only when drawing the list: a disabled button is a courtesy, not
  // a rule. The rule is on the server, and this mirrors where it lives.
  if (!u || !owns(id)) return
  current = id
  markActive(id)
  document.getElementById('title').textContent = u.title
  document.getElementById('meta').textContent =
    `${u.id} · ${u.pages} 頁 · ${(u.bytes / 1024 / 1024).toFixed(1)} MB`
    + (u.group ? ` · ${u.group}` : '')
  const v = document.getElementById('view')
  v.src = u.file + '#view=FitH'
  v.hidden = false
  document.getElementById('empty').hidden = true
}

function close() {
  current = null
  document.getElementById('view').hidden = true
  document.getElementById('view').src = ''
  document.getElementById('empty').hidden = false
  document.getElementById('title').textContent = '選擇一個章節'
  document.getElementById('meta').textContent = ''
}

document.getElementById('all').addEventListener('change', e => { all = e.target.checked; render() })

fetch('manifest.json').then(r => r.json()).then(m => { manifest = m; render() })
  .catch(e => { document.getElementById('empty').innerHTML =
    `<div><p>讀不到 manifest.json：${e.message}</p></div>` })
</script>
