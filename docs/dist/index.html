<!doctype html>
<!--
  舊入口的轉址。

  站以前住在 /dist/（GitHub Pages 的「從分支部署」只服務得了根目錄或 /docs，指定不了
  dist，所以建置產物只能連同整個 repo 一起被送出去）。輸出改到 docs/ 之後，網址變成
  乾淨的根目錄，但已經發出去的連結還指著舊的那個。

  而且 GitHub 會把 shawnlin0201.github.io/plakoro-arena/* 整條路徑轉到自訂網域，所以
  舊書籤最後會落在 https://plakoro.tw/dist/ —— 不留這一頁的話，那是一片空白。

  query 與 hash 一起帶過去：綠界付完款導回來的網址是 /?ecpay=訂單編號，手冊的深連結是
  /#/handbook。只轉到首頁的話，那些人會掉到一個沒有上下文的畫面。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAKORO ARENA</title>
<script>
  location.replace('/' + location.search + location.hash)
</script>
<!-- JavaScript 關掉時的退路。0 秒，而且上面那行 script 正常情況下早就跑完了。 -->
<meta http-equiv="refresh" content="0; url=/">
<style>body{margin:0;background:#F5F3EC}</style>
</head>
<!--
  刻意不寫「網址換新了，請自行更新書籤」那類文案：這一頁在設計上不會被看到，寫了反而
  像在要求使用者自己處理一件我們已經處理掉的事。連 script 跟 meta refresh 都失效的
  瀏覽器才會停在這裡，那時候一個連結就夠了。
-->
<body><a href="/">PLAKORO ARENA</a></body>
</html>
