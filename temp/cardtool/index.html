<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EBW02 角色骰面登錄</title>
<style>
  :root {
    --bg: #faf9f5;
    --card: #fff;
    --ink: #2b2b28;
    --sub: #8d8d84;
    --line: #e6e3da;
    --on: #1f1f1d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, "Hiragino Sans", "Noto Sans TC", sans-serif;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--on);
    color: #fff;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .04em; }
  .count { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; opacity: .8; }
  header .grow { flex: 1; }
  header button {
    font: inherit; font-size: 13px; font-weight: 800;
    padding: 5px 12px; border: 0; border-radius: 4px;
    background: #fff; color: var(--on); cursor: pointer;
  }
  header button.ghost { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }

  .bar { height: 3px; background: rgba(255,255,255,.2); }
  .bar > i { display: block; height: 100%; background: #AEFF3E; width: 0; transition: width .2s; }

  main { max-width: 820px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .card.done { border-color: var(--on); }

  .head {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; background: var(--on); color: #fff;
  }
  .head .id { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; opacity: .7; }
  .head .nm { font-size: 14px; font-weight: 800; }
  .head .ja { font-size: 12px; opacity: .7; }
  .head .tick { margin-left: auto; font-size: 13px; font-weight: 800; color: #AEFF3E; visibility: hidden; }
  .card.done .tick { visibility: visible; }

  .body { display: flex; gap: 12px; padding: 10px; flex-wrap: wrap; }

  /* The card scan, cropped out of its sheet. It is here to identify the move, not to read the
     die faces off — the SAMPLE watermark destroys those, which is the whole reason for this
     tool. The icon strip is blown up underneath so the boxes can at least be counted. */
  .shot { flex: 0 0 300px; display: flex; flex-direction: column; gap: 6px; }
  .shot canvas { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; }
  .shot canvas.zoom { image-rendering: pixelated; }

  .slots { flex: 1 1 300px; display: flex; flex-direction: column; gap: 10px; min-width: 260px; }
  .slot { display: flex; flex-direction: column; gap: 5px; }
  .slot .eff { font-size: 13px; font-weight: 700; color: var(--ink); }
  .slot .eff b { color: var(--sub); font-weight: 700; font-size: 11px; margin-right: 4px; }
  .faces { display: flex; gap: 5px; flex-wrap: wrap; }
  .faces button {
    font: inherit; font-size: 15px; font-weight: 800;
    width: 40px; height: 36px;
    border: 1px solid var(--line); border-radius: 4px;
    background: #fff; color: var(--ink); cursor: pointer;
  }
  .faces button.on { background: var(--on); border-color: var(--on); color: #fff; }
  .faces .preset {
    width: auto; padding: 0 8px; font-size: 12px; font-weight: 700;
    color: var(--sub);
  }
  .picked { font-size: 12px; font-weight: 800; color: var(--sub); font-variant-numeric: tabular-nums; }

  footer { padding: 24px 14px 60px; text-align: center; color: var(--sub); font-size: 12px; }
  textarea { width: 100%; height: 180px; font: 12px/1.4 ui-monospace, monospace; }
</style>
</head>
<body>

<header>
  <h1>EBW02 角色骰面登錄</h1>
  <span class="count" id="count">0 / 60</span>
  <span class="grow"></span>
  <button id="export">匯出 JSON</button>
  <button class="ghost" id="clear">清空</button>
</header>
<div class="bar"><i id="barfill"></i></div>

<main id="list"></main>

<footer>
  每按一下就存進這台瀏覽器的 localStorage，關掉再開會接著填。<br>
  六個面：立（站著）、逆（倒過來）、上、下、左、右 —— 和專案既有資料同一套寫法。
</footer>

<script>
const FACES = ['立', '逆', '上', '下', '左', '右']
// The combinations that actually occur in the 140 rows already in the project. Offered as
// one-tap presets because five of them cover most of the table; the individual buttons are
// still there for anything else.
const PRESETS = ['立,左,右', '立,上', '立,上,下', '立,上,左,右', '立']
const KEY = 'ebw02-charadie-v1'
const SHEET_SRC = {
  'ゲッコウガ': '../%E3%82%B2%E3%83%83%E3%82%B3%E3%82%A6%E3%82%AC-skill.png',
  'カヌチャン': '../%E3%82%AB%E3%83%8C%E3%83%81%E3%83%A3%E3%83%B3-skill.png',
  'ヤミラミ':   '../%E3%83%A4%E3%83%9F%E3%83%A9%E3%83%9F-skill.png',
  'ボスゴドラ': '../%E3%83%9C%E3%82%B9%E3%82%B4%E3%83%89%E3%83%A9-skill.png',
  'レックウザ': '../%E3%83%AC%E3%83%83%E3%82%AF%E3%82%A6%E3%82%B6-skill.png',
  'ラッキー':   '../%E3%83%A9%E3%83%83%E3%82%AD%E3%83%BC-skill.png'
}
// Measured off the sheets: two columns, five rows, 582 apart across and 302 down.
const CARD = { x0: 16, y0: 112, w: 562, h: 300, dx: 582, dy: 302 }
const STRIP = { x: 18, y: 286, w: 120, h: 38 }

let CARDS = []
let state = load()

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch { return {} }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)) } catch {}
}

const sheetCache = {}
function sheet(name) {
  if (!sheetCache[name]) {
    sheetCache[name] = new Promise((res, rej) => {
      const im = new Image()
      im.onload = () => res(im)
      im.onerror = rej
      im.src = SHEET_SRC[name]
    })
  }
  return sheetCache[name]
}

async function paint(canvas, c, kind) {
  const im = await sheet(c.sheet)
  const ctx = canvas.getContext('2d')
  ctx.imageSmoothingEnabled = kind !== 'zoom'
  if (kind === 'card') {
    const sx = CARD.x0 + c.col * CARD.dx, sy = CARD.y0 + c.row * CARD.dy
    canvas.width = CARD.w; canvas.height = CARD.h
    ctx.drawImage(im, sx, sy, CARD.w, CARD.h, 0, 0, CARD.w, CARD.h)
  } else {
    const sx = STRIP.x + c.col * CARD.dx, sy = STRIP.y + c.row * CARD.dy
    const Z = 4
    canvas.width = STRIP.w * Z; canvas.height = STRIP.h * Z
    ctx.drawImage(im, sx, sy, STRIP.w, STRIP.h, 0, 0, STRIP.w * Z, STRIP.h * Z)
  }
}

function keyOf(c, i) { return c.id + '#' + i }

function render() {
  const list = document.getElementById('list')
  list.innerHTML = ''
  CARDS.forEach(c => {
    const el = document.createElement('section')
    el.className = 'card'
    el.innerHTML = `
      <div class="head">
        <span class="id">${c.id}</span>
        <span class="nm">${c.nameZh}</span>
        <span class="ja">${c.nameJa}</span>
        <span class="tick">✓</span>
      </div>
      <div class="body">
        <div class="shot">
          <canvas data-kind="card"></canvas>
          <canvas class="zoom" data-kind="zoom"></canvas>
        </div>
        <div class="slots"></div>
      </div>`
    el.querySelectorAll('canvas').forEach(cv => paint(cv, c, cv.dataset.kind))

    const slots = el.querySelector('.slots')
    c.slots.forEach((text, i) => {
      const k = keyOf(c, i)
      const wrap = document.createElement('div')
      wrap.className = 'slot'
      const label = c.slots.length > 1 ? `效果 ${i + 1}` : '角色骰'
      wrap.innerHTML = `<div class="eff"><b>${label}</b>${text}</div>`

      const faces = document.createElement('div')
      faces.className = 'faces'
      FACES.forEach(f => {
        const b = document.createElement('button')
        b.textContent = f
        b.onclick = () => {
          const cur = new Set(state[k] || [])
          cur.has(f) ? cur.delete(f) : cur.add(f)
          // Kept in FACES order so two people filling the same card produce the same string.
          state[k] = FACES.filter(x => cur.has(x))
          if (!state[k].length) delete state[k]
          save(); refresh(el, c)
        }
        faces.appendChild(b)
      })
      PRESETS.forEach(p => {
        const b = document.createElement('button')
        b.className = 'preset'
        b.textContent = p
        b.onclick = () => { state[k] = p.split(','); save(); refresh(el, c) }
        faces.appendChild(b)
      })
      wrap.appendChild(faces)
      const picked = document.createElement('div')
      picked.className = 'picked'
      wrap.appendChild(picked)
      slots.appendChild(wrap)
    })

    list.appendChild(el)
    refresh(el, c)
  })
  tally()
}

function refresh(el, c) {
  const slots = [...el.querySelectorAll('.slot')]
  let all = true
  slots.forEach((s, i) => {
    const picked = state[keyOf(c, i)] || []
    if (!picked.length) all = false
    s.querySelectorAll('.faces button').forEach(b => {
      if (!b.classList.contains('preset')) b.classList.toggle('on', picked.includes(b.textContent))
    })
    s.querySelector('.picked').textContent = picked.length ? picked.join(',') : '—'
  })
  el.classList.toggle('done', all)
  tally()
}

function tally() {
  const done = CARDS.filter(c => c.slots.every((_, i) => (state[keyOf(c, i)] || []).length)).length
  document.getElementById('count').textContent = `${done} / ${CARDS.length}`
  document.getElementById('barfill').style.width = (done / CARDS.length * 100) + '%'
}

document.getElementById('export').onclick = () => {
  // Shaped the way waza.json wants it, so applying this is a mechanical merge and not a
  // second round of interpretation.
  const out = CARDS.map(c => {
    const row = { id: c.id, chara: c.chara, waza: c.nameJa }
    c.slots.forEach((text, i) => {
      row['chara_die' + (i + 1)] = (state[keyOf(c, i)] || []).join(',') || null
      row['chara_effect' + (i + 1) + '_zh'] = text
    })
    return row
  })
  const blob = new Blob([JSON.stringify(out, null, 2) + '\n'], { type: 'application/json' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = 'ebw02-charadie.json'
  a.click()
}

document.getElementById('clear').onclick = () => {
  if (!confirm('清空全部已登錄的面？')) return
  state = {}; save(); render()
}

fetch('cards.json').then(r => r.json()).then(d => { CARDS = d; render() })
</script>
</body>
</html>
